; Seeed T1000-E (nRF52840 + LR1110) — GPS Game board variant
;
; This is the recommended player device target: GPS and LoRa built in,
; compact form factor, suitable for field deployment.
;
; [t1000-e] sets the board hardware: MC_VARIANT picks up
; meshcore/variants/t1000-e/ HAL files via build_as_lib.py.
; nRF52 lib paths reference the meshcore/ submodule explicitly.
;
; Environments:
;   t1000e_gps_device   — player tracker device (src/device/)

[t1000-e]
extends = nrf52_base
board = tracker-t1000-e
board_build.ldscript = meshcore/boards/nrf52840_s140_v7.ld
build_flags =
    ${nrf52_base.build_flags}
    -D MC_VARIANT='"t1000-e"'
    -D T1000_E
    -D PIN_USER_BTN=6
    -D USER_BTN_PRESSED=HIGH
    -D PIN_STATUS_LED=24
    -D RADIO_CLASS=CustomLR1110
    -D WRAPPER_CLASS=CustomLR1110Wrapper
    -D LORA_TX_POWER=22
    -D RF_SWITCH_TABLE
    -D RX_BOOSTED_GAIN=true
    -D P_LORA_BUSY=7
    -D P_LORA_SCLK=11
    -D P_LORA_NSS=12
    -D P_LORA_DIO_1=33
    -D P_LORA_MISO=40
    -D P_LORA_MOSI=41
    -D P_LORA_RESET=42
    -D LR11X0_DIO_AS_RF_SWITCH=true
    -D LR11X0_DIO3_TCXO_VOLTAGE=1.6
    -D ENV_INCLUDE_GPS=1
    -I meshcore/lib/nrf52/s140_nrf52_7.3.0_API/include
    -I meshcore/lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
debug_tool = jlink
upload_protocol = nrfutil

[env:t1000e_gps_device]
extends = t1000-e
build_flags =
    ${t1000-e.build_flags}
    -D ADVERT_NAME='"GPS Device"'
    -D ADVERT_LAT=0.0
    -D ADVERT_LON=0.0
    -D FRIENDLY_ID=1
build_src_filter =
    +<device>
lib_deps =
    ${t1000-e.lib_deps}
