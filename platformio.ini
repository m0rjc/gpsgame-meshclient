; GPS Game — standalone PlatformIO project
;
; MeshCore is consumed as a PlatformIO library via the `meshcore/` git submodule.
; After cloning, initialise the submodule with:
;
;   git submodule update --init --recursive
;
; The MeshCore library build script (meshcore/build_as_lib.py) reads build_flags
; at compile time to select which board HAL and helper sources to compile:
;
;   MC_VARIANT="<board>"       → meshcore/variants/<board>/ HAL files
;   DISPLAY_CLASS="<class>"    → meshcore/src/helpers/ui/<class>.cpp
;   Platform defines           → platform-specific helpers (ESP32, NRF52, etc.)
;
; Board variant configurations live under variants/*/platformio.ini and are
; auto-loaded via extra_configs.  Each variant file defines:
;   [board-base-section]  — extends a platform base; sets MC_VARIANT + pin defs
;   [env:board_gps_device]   — builds src/device/ for that board
;   [env:board_gps_gateway]  — builds src/gateway/ for that board
;
; Local overrides (upload port, passwords, etc.) go in platformio.local.ini
; which is git-ignored.

[platformio]
extra_configs =
    variants/*/platformio.ini
    platformio.local.ini

; ── Common Arduino base ───────────────────────────────────────────────────────
; lib_deps includes `file://./meshcore` so PlatformIO picks up MeshCore and
; invokes build_as_lib.py to select the right subset of MeshCore sources.
; All other entries are the same third-party libraries MeshCore itself depends on.

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
    SPI
    Wire
    jgromes/RadioLib @ ^7.6.0
    rweather/Crypto @ ^0.4.0
    adafruit/RTClib @ ^2.1.3
    melopero/Melopero RV3028 @ ^1.1.0
    electroniccats/CayenneLPP @ 1.6.1
    stevemarple/MicroNMEA @ ^2.0.6
    file://./meshcore
build_flags =
    -w -DNDEBUG
    -D RADIOLIB_STATIC_ONLY=1
    -D RADIOLIB_GODMODE=1
    -D LORA_FREQ=869.618
    -D LORA_BW=62.5
    -D LORA_SF=8
    -D ENABLE_ADVERT_ON_BOOT=1
    -D RADIOLIB_EXCLUDE_CC1101=1
    -D RADIOLIB_EXCLUDE_RF69=1
    -D RADIOLIB_EXCLUDE_SX1231=1
    -D RADIOLIB_EXCLUDE_SI443X=1
    -D RADIOLIB_EXCLUDE_RFM2X=1
    -D RADIOLIB_EXCLUDE_SX128X=1
    -D RADIOLIB_EXCLUDE_AFSK=1
    -D RADIOLIB_EXCLUDE_AX25=1
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
    -D RADIOLIB_EXCLUDE_MORSE=1
    -D RADIOLIB_EXCLUDE_APRS=1
    -D RADIOLIB_EXCLUDE_BELL=1
    -D RADIOLIB_EXCLUDE_RTTY=1
    -D RADIOLIB_EXCLUDE_SSTV=1

; ── ESP32 ─────────────────────────────────────────────────────────────────────
[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts = post:meshcore/merge-bin.py
build_flags = ${arduino_base.build_flags}
    -D ESP32_PLATFORM

[esp32_ota]
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.10.3
    file://meshcore/arch/esp32/AsyncElegantOTA

; ── nRF52 ─────────────────────────────────────────────────────────────────────
[nrf52_base]
extends = arduino_base
platform = nordicnrf52
platform_packages =
    framework-arduinoadafruitnrf52 @ 1.10700.0
extra_scripts =
    meshcore/create-uf2.py
    meshcore/arch/nrf52/extra_scripts/patch_bluefruit.py
build_flags = ${arduino_base.build_flags}
    -D NRF52_PLATFORM
    -D LFS_NO_ASSERT=1
    -D EXTRAFS=1
lib_deps =
    ${arduino_base.lib_deps}
    https://github.com/oltaco/CustomLFS @ 0.2.1

; ── RP2040 ────────────────────────────────────────────────────────────────────
[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
build_flags = ${arduino_base.build_flags}
    -D RP2040_PLATFORM

; ── Sensor helpers (GPS, env sensors) ────────────────────────────────────────
; Add to a variant's lib_deps when the board carries I2C sensors.
[sensor_base]
build_flags =
    -D ENV_INCLUDE_GPS=1
    -D ENV_INCLUDE_AHTX0=1
    -D ENV_INCLUDE_BME280=1
    -D ENV_INCLUDE_BMP280=1
    -D ENV_INCLUDE_SHTC3=1
    -D ENV_INCLUDE_SHT4X=1
    -D ENV_INCLUDE_LPS22HB=1
    -D ENV_INCLUDE_INA3221=1
    -D ENV_INCLUDE_INA219=1
    -D ENV_INCLUDE_INA226=1
    -D ENV_INCLUDE_INA260=1
    -D ENV_INCLUDE_MLX90614=1
    -D ENV_INCLUDE_VL53L0X=1
    -D ENV_INCLUDE_BME680=1
    -D ENV_INCLUDE_BMP085=1
lib_deps =
    adafruit/Adafruit INA3221 Library @ ^1.0.1
    adafruit/Adafruit INA219 @ ^1.2.3
    robtillaart/INA226 @ ^0.6.4
    adafruit/Adafruit INA260 Library @ ^1.5.3
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BME280 Library @ ^2.3.0
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit SHTC3 Library @ ^1.0.1
    sensirion/Sensirion I2C SHT4x @ ^1.1.2
    arduino-libraries/Arduino_LPS22HB @ ^1.0.2
    adafruit/Adafruit MLX90614 Library @ ^2.1.5
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    adafruit/Adafruit BME680 Library @ ^2.0.4
    adafruit/Adafruit BMP085 Library @ ^1.2.4
