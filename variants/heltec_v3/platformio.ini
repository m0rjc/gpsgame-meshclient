; Heltec WiFi LoRa 32 V3 — GPS Game board variant
;
; [heltec_v3] sets the board hardware: MC_VARIANT picks up
; meshcore/variants/heltec_v3/ HAL files via build_as_lib.py.
;
; Environments:
;   heltec_v3_gps_device   — player tracker device (src/device/)
;   heltec_v3_gps_gateway  — game gateway with WiFi (src/gateway/)

[heltec_v3]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_base.build_flags}
    -D MC_VARIANT='"heltec_v3"'
    -D HELTEC_LORA_V3
    -D ESP32_CPU_FREQ=80
    -D P_LORA_DIO_1=14
    -D P_LORA_NSS=8
    -D P_LORA_RESET=RADIOLIB_NC
    -D P_LORA_BUSY=13
    -D P_LORA_SCLK=9
    -D P_LORA_MISO=11
    -D P_LORA_MOSI=10
    -D USE_SX1262
    -D RADIO_CLASS=CustomSX1262
    -D WRAPPER_CLASS=CustomSX1262Wrapper
    -D LORA_TX_POWER=22
    -D P_LORA_TX_LED=35
    -D PIN_BOARD_SDA=17
    -D PIN_BOARD_SCL=18
    -D PIN_USER_BTN=0
    -D PIN_VEXT_EN=36
    -D SX126X_DIO2_AS_RF_SWITCH=true
    -D SX126X_DIO3_TCXO_VOLTAGE=1.8
    -D SX126X_CURRENT_LIMIT=140
    -D SX126X_RX_BOOSTED_GAIN=1
    -D PIN_GPS_RX=47
    -D PIN_GPS_TX=48
    -D PIN_GPS_EN=26
    -D DISPLAY_CLASS=SSD1306Display
lib_deps =
    ${esp32_base.lib_deps}
    ${esp32_ota.lib_deps}
    bakercp/CRC32 @ ^2.0.0

[env:heltec_v3_gps_device]
extends = heltec_v3
build_flags =
    ${heltec_v3.build_flags}
    -D ADVERT_NAME='"GPS Device"'
    -D ADVERT_LAT=0.0
    -D ADVERT_LON=0.0
    -D FRIENDLY_ID=1
build_src_filter =
    +<device>
lib_deps =
    ${heltec_v3.lib_deps}

[env:heltec_v3_gps_gateway]
extends = heltec_v3
build_flags =
    ${heltec_v3.build_flags}
    -D ADVERT_NAME='"GPS Gateway"'
    -D ADVERT_LAT=0.0
    -D ADVERT_LON=0.0
    -D ADMIN_PASSWORD='"password"'
    -D WIFI_SSID='"myssid"'
    -D WIFI_PWD='"mypwd"'
build_src_filter =
    +<gateway>
lib_deps =
    ${heltec_v3.lib_deps}
